<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 3D Electric Blue Gradients -->
    <linearGradient id="ribbonMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#002b99" />
    </linearGradient>

    <linearGradient id="ribbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001854" />
      <stop offset="60%" stop-color="#0044cc" />
      <stop offset="100%" stop-color="#00aaff" />
    </linearGradient>

    <linearGradient id="glowGleam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cce5ff" />
    </linearGradient>

    <linearGradient id="clockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0040c8" />
    </linearGradient>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002b99" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#shadow3D)">
    <!-- Outer 3D Triangle Ribbon Loop -->
    <path d="M 100,18 C 108,18 116,24 122,34 L 174,124 C 182,138 178,154 164,164 C 150,174 130,174 100,174 C 70,174 50,174 36,164 C 22,154 18,138 26,124 L 78,34 C 84,24 92,18 100,18 Z" 
          fill="url(#ribbonMain)" />

    <!-- Inner Cutout for Mobius 3D Ribbon Curve -->
    <path d="M 100,46 L 148,132 C 152,140 144,148 132,148 C 118,148 82,148 68,148 C 56,148 48,140 52,132 Z" 
          fill="url(#ribbonDark)" />

    <!-- 3D Gloss Highlight Stripe -->
    <path d="M 100,18 C 108,18 116,24 122,34 L 168,114 C 160,95 140,55 108,24 C 105,20 102,18 100,18 Z" 
          fill="url(#glowGleam)" />

    <!-- Workforce Silhouette inside Triangle Center -->
    <g transform="translate(100, 108)">
      <!-- Left Assistant Worker -->
      <circle cx="-24" cy="-8" r="8" fill="#a0c8ff" />
      <path d="M -36,14 C -36,2 -28,-4 -24,-4 C -20,-4 -12,2 -12,14 Z" fill="#80b8ff" />

      <!-- Right Assistant Worker -->
      <circle cx="24" cy="-8" r="8" fill="#a0c8ff" />
      <path d="M 12,14 C 12,2 20,-4 24,-4 C 28,-4 36,2 36,14 Z" fill="#80b8ff" />

      <!-- Center Master Contractor Worker with Safety Helmet -->
      <path d="M -16,-16 C -16,-26 -8,-32 0,-32 C 8,-32 16,-26 16,-16 Z" fill="url(#workerGrad)" />
      <!-- Helmet Brim -->
      <path d="M -20,-15 C -20,-18 20,-18 20,-15 C 20,-13 -20,-13 -20,-15 Z" fill="#ffffff" />
      <circle cx="0" cy="-6" r="10" fill="url(#workerGrad)" />
      <!-- Contractor Body/Torso -->
      <path d="M -22,20 C -22,4 -12,-2 0,-2 C 12,-2 22,4 22,20 Z" fill="url(#workerGrad)" />
    </g>

    <!-- Time / Clock Badge on Lower Right Outer Curve -->
    <g transform="translate(142, 138)">
      <circle cx="0" cy="0" r="22" fill="#001844" stroke="url(#clockRing)" stroke-width="4" />
      <circle cx="0" cy="0" r="17" fill="url(#clockRing)" />
      <!-- Clock Face Dial -->
      <circle cx="0" cy="0" r="13" fill="#ffffff" />
      <!-- Clock Hands showing 09:00 Shift -->
      <path d="M 0,0 L 0,-8 M 0,0 L 5,0" stroke="#002b99" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2" fill="#002b99" />
    </g>
  </g>
</svg>
