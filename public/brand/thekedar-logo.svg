<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D Icon Symbol -->
    <linearGradient id="logoRibbonMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#002b99" />
    </linearGradient>

    <linearGradient id="logoRibbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001854" />
      <stop offset="60%" stop-color="#0044cc" />
      <stop offset="100%" stop-color="#00aaff" />
    </linearGradient>

    <linearGradient id="logoGleam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="logoWorkerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cce5ff" />
    </linearGradient>

    <!-- Gradients for Text "Thekedar" -->
    <linearGradient id="textNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#05122e" />
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0044cc" />
    </linearGradient>

    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0044cc" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#002b99" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- LEFT: 3D ICON SYMBOL (Scale 0.75, offset X=15, Y=8) -->
    <g transform="translate(15, 8) scale(0.75)">
      <!-- Outer 3D Triangle Ribbon Loop -->
      <path d="M 100,18 C 108,18 116,24 122,34 L 174,124 C 182,138 178,154 164,164 C 150,174 130,174 100,174 C 70,174 50,174 36,164 C 22,154 18,138 26,124 L 78,34 C 84,24 92,18 100,18 Z" 
            fill="url(#logoRibbonMain)" />

      <!-- Inner Cutout for Mobius 3D Ribbon Curve -->
      <path d="M 100,46 L 148,132 C 152,140 144,148 132,148 C 118,148 82,148 68,148 C 56,148 48,140 52,132 Z" 
            fill="url(#logoRibbonDark)" />

      <!-- Gloss Highlight -->
      <path d="M 100,18 C 108,18 116,24 122,34 L 168,114 C 160,95 140,55 108,24 C 105,20 102,18 100,18 Z" 
            fill="url(#logoGleam)" />

      <!-- Workforce Silhouette inside Triangle -->
      <g transform="translate(100, 108)">
        <circle cx="-24" cy="-8" r="8" fill="#a0c8ff" />
        <path d="M -36,14 C -36,2 -28,-4 -24,-4 C -20,-4 -12,2 -12,14 Z" fill="#80b8ff" />

        <circle cx="24" cy="-8" r="8" fill="#a0c8ff" />
        <path d="M 12,14 C 12,2 20,-4 24,-4 C 28,-4 36,2 36,14 Z" fill="#80b8ff" />

        <!-- Master Contractor Worker -->
        <path d="M -16,-16 C -16,-26 -8,-32 0,-32 C 8,-32 16,-26 16,-16 Z" fill="url(#logoWorkerGrad)" />
        <path d="M -20,-15 C -20,-18 20,-18 20,-15 C 20,-13 -20,-13 -20,-15 Z" fill="#ffffff" />
        <circle cx="0" cy="-6" r="10" fill="url(#logoWorkerGrad)" />
        <path d="M -22,20 C -22,4 -12,-2 0,-2 C 12,-2 22,4 22,20 Z" fill="url(#logoWorkerGrad)" />
      </g>

      <!-- Clock Badge -->
      <g transform="translate(142, 138)">
        <circle cx="0" cy="0" r="22" fill="#001844" stroke="url(#textCyan)" stroke-width="4" />
        <circle cx="0" cy="0" r="17" fill="url(#textCyan)" />
        <circle cx="0" cy="0" r="13" fill="#ffffff" />
        <path d="M 0,0 L 0,-8 M 0,0 L 5,0" stroke="#002b99" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="0" cy="0" r="2" fill="#002b99" />
      </g>
    </g>

    <!-- RIGHT: WORDMARK "Thekedar" WITH ROOF ACCENT -->
    <g transform="translate(165, 0)">
      <!-- 3D Roof / House Beam Accent over "dar" -->
      <path d="M 310,55 L 430,12 L 442,12 L 442,22 L 452,22 L 452,18 L 475,32 L 465,40 L 430,22 L 322,64 Z" 
            fill="url(#roofGrad)" />

      <!-- "Theke" in Solid Bold 3D Dark Navy -->
      <text x="0" y="112" 
            font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="-1.5" 
            fill="url(#textNavy)">Theke</text>

      <!-- "dar" in Electric 3D Cyan Blue -->
      <text x="282" y="112" 
            font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="-1.5" 
            fill="url(#textCyan)">dar</text>

      <!-- Curved Blue Swoosh Underline under "Thekedar" -->
      <path d="M -5,128 C 120,146 280,144 460,128 C 300,135 120,135 -5,128 Z" 
            fill="url(#roofGrad)" opacity="0.9" />
    </g>
  </g>
</svg>
